name: PlanPing scraper

on:
  schedule:
    - cron: '0 3 * * *'   # open data scrape
    - cron: '0 4 * * *'   # idox nightly scrape — batch 1 of 4
    - cron: '50 4 * * *'  # idox nightly scrape — batch 2 of 4
    - cron: '40 5 * * *'  # idox nightly scrape — batch 3 of 4
    - cron: '30 6 * * *'  # idox nightly scrape — batch 4 of 4
    - cron: '20 7 * * *'  # arcus nightly scrape
    - cron: '35 7 * * *'  # civica nightly scrape (St Albans)
    - cron: '50 7 * * *'  # northgate nightly scrape (Runnymede)
    - cron: '0 9 * * *'   # alerts
    - cron: '0 8 * * 1'   # council health digest — weekly, Monday 8am
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'scrape'
        type: choice
        options: [scrape, scrape_bulk, scrape_idox_a, scrape_idox_b, scrape_idox_c, scrape_idox_d, scrape_idox_targeted, scrape_idox_bulk, scrape_arcus, scrape_arcus_bulk, scrape_civica, scrape_northgate, scrape_ni, alerts, council_health, arcus_recon, idox_month_test, idox_form_recon, idox_multi_recon, idox_recon_round2, civica_recon, civica_stalbans_results_recon, harrow_weekly_recon, northgate_recon, northgate_runnymede_results_recon, northgate_url_healthcheck, idox_gap_prober, idox_cheltenham_lewisham_verify, redbridge_recon, diagnose_runner_location, applicant_agent_recon, brightdata_unlocker_test, scraperapi_test, brightdata_browser_api_test, ni_planningsystemni_recon]
      arcus_target_url:
        description: '(arcus_recon only) base URL to reconnoitre, e.g. https://example.my.site.com/pr/s — leave blank to default to Ashford as a sanity check'
        required: false
        default: ''
      arcus_target_name:
        description: '(arcus_recon only) human-readable name for the council being reconnoitred, purely for log readability'
        required: false
        default: ''

jobs:
  # ---------------------------------------------------------------------
  # diagnose_runner_location — added 2026-08-02, manual-trigger only.
  # Real test of a genuinely important hypothesis: GitHub's own
  # documentation confirms standard ubuntu-latest hosted runners run
  # from Azure's East US 2 region, not the UK — and several Idox
  # councils' WAFs may be geo-blocking or geo-throttling non-UK traffic
  # the same way a VPN showing as offshore gets blocked on these same
  # portals when tested manually. If confirmed, this would explain a
  # large fraction of the persistent 429/WAF blocks fought all session —
  # none of which responded to pacing, concurrency, or retry changes,
  # none of which touch WHERE the traffic appears to come from. Checks
  # two independent geolocation services for cross-confirmation, since
  # a single service could occasionally be wrong or stale.
  #
  # DELIBERATELY KEPT on ubuntu-latest (not moved to the UK runner) —
  # this is the whole point of the job, it needs to keep showing what
  # GitHub's OWN infrastructure presents as, as a permanent baseline to
  # compare the UK runner against.
  # ---------------------------------------------------------------------
  diagnose_runner_location:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'diagnose_runner_location'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check real IP and geolocation (ipinfo.io)
        run: |
          echo "=== ipinfo.io ==="
          curl -s https://ipinfo.io/json || echo "ipinfo.io request failed"
      - name: Check real IP and geolocation (ip-api.com)
        run: |
          echo "=== ip-api.com ==="
          curl -s http://ip-api.com/json || echo "ip-api.com request failed"
      - name: Summary
        run: |
          echo ""
          echo "If both services above report a country OTHER than GB/United"
          echo "Kingdom, that's real, direct confirmation our scraper traffic"
          echo "presents as non-UK to any council WAF checking geolocation —"
          echo "the same mechanism a VPN showing as offshore triggers on these"
          echo "same portals when tested manually."

  scrape:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Run harvester
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: cd scrapers && python data_gov_harvester.py

  scrape_bulk:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_bulk'
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Run bulk harvester
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: cd scrapers && python data_gov_harvester.py --bulk

  # ---------------------------------------------------------------------
  # Idox nightly scrape — split into 4 batches. See idox_scraper.py's
  # --batch/--total-batches flags — the split is computed dynamically
  # from IDOX_COUNCILS' current length, nothing here needs updating as
  # councils are added or removed.
  # ---------------------------------------------------------------------
  scrape_idox_a:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_a') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — nightly batch 1 of 4 (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=1 --total-batches=4

  scrape_idox_b:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_b') ||
      (github.event_name == 'schedule' && github.event.schedule == '50 4 * * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — nightly batch 2 of 4 (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=2 --total-batches=4

  scrape_idox_c:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_c') ||
      (github.event_name == 'schedule' && github.event.schedule == '40 5 * * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — nightly batch 3 of 4 (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=3 --total-batches=4

  scrape_idox_d:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_d') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 6 * * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — nightly batch 4 of 4 (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=4 --total-batches=4

  scrape_idox_targeted:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_targeted'
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — targeted group (confirmed WAF/429 councils)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "30"
          DAYS_BACK: "14"
          CONCURRENCY: "1"
          REQUEST_DELAY_SECONDS: "5"
        run: cd scrapers && python idox_scraper.py --targeted

  scrape_idox_bulk:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_bulk'
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — bulk (last 180 days, full council list)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "180"
          DAYS_BACK: "180"
          CONCURRENCY: "1"
        run: cd scrapers && python idox_scraper.py --bulk

  scrape_arcus:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_arcus') ||
      (github.event_name == 'schedule' && github.event.schedule == '20 7 * * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Arcus scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "30"
          CONCURRENCY: "2"
        run: cd scrapers && python arcus_scraper.py

  scrape_arcus_bulk:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_arcus_bulk'
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Arcus scraper — bulk (180 days back for advanced_search councils)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "80"
          CONCURRENCY: "2"
          BULK_DAYS_BACK: "180"
        run: cd scrapers && python arcus_scraper.py --bulk

  scrape_civica:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_civica') ||
      (github.event_name == 'schedule' && github.event.schedule == '35 7 * * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright httpx
      - run: playwright install --with-deps chromium
      - name: Run Civica scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "15"
          CONCURRENCY: "2"
        run: cd scrapers && python civica_scraper.py

  idox_month_test:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'idox_month_test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox month-selection diagnostic
        run: cd scrapers && python idox_month_test.py

  idox_form_recon:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'idox_form_recon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Run Idox form-element recon
        run: cd scrapers && python idox_form_recon.py
      - name: Upload recon output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idox-form-recon-output
          path: /tmp/idox_form_recon.*
          retention-days: 7

  idox_multi_recon:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'idox_multi_recon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Run Idox multi-council recon (Renfrewshire/Brighton/Tonbridge/Brent)
        run: cd scrapers && python idox_multi_recon.py
      - name: Upload recon output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idox-multi-recon-output
          path: /tmp/idox_recon_*.html
          retention-days: 7

  idox_recon_round2:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'idox_recon_round2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Run Idox recon round 2 (real form-submit flow)
        run: cd scrapers && python idox_recon_round2.py
      - name: Upload recon output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idox-recon-round2-output
          path: /tmp/idox_recon2_*.html
          retention-days: 7

  alerts:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'alerts') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Dispatch alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: python dispatch_alerts.py

  council_health:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'council_health') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Check council health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: cd scrapers && python council_health_check.py

  arcus_recon:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'arcus_recon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Run Arcus recon
        env:
          ARCUS_TARGET_URL: ${{ github.event.inputs.arcus_target_url }}
          ARCUS_TARGET_NAME: ${{ github.event.inputs.arcus_target_name }}
        run: cd scrapers && python arcus_recon.py
      - name: Upload recon output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcus-recon-output
          path: /tmp/arcus_recon_*
          retention-days: 7

  civica_recon:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'civica_recon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Run Civica recon (Wrexham, Northampton, Erewash)
        run: cd scrapers && python civica_recon.py
      - name: Upload recon output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civica-recon-output
          path: /tmp/civica_recon_*
          retention-days: 7

  civica_stalbans_results_recon:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'civica_stalbans_results_recon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Run Civica Portal360 results-page recon (St Albans)
        run: cd scrapers && python civica_stalbans_results_recon.py
      - name: Upload recon output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civica-stalbans-results-recon-output
          path: /tmp/civica_stalbans_results.*
          retention-days: 7

  harrow_weekly_recon:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'harrow_weekly_recon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Run Harrow weekly-list recon
        run: cd scrapers && python harrow_weekly_recon.py
      - name: Upload recon output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harrow-weekly-recon-output
          path: /tmp/harrow_weekly_recon.*
          retention-days: 7

  northgate_recon:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'northgate_recon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright
