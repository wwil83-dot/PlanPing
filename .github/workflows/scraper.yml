  # ---------------------------------------------------------------------
  # Applicant/agent data recon — manual trigger only, no schedule.
  #
  # Built 2026-08-13, before committing any code to exposing applicant/
  # agent intelligence (flagged in an external product assessment as
  # the single biggest commercial opportunity). Real, unverified
  # concern before committing: does a real Idox LIST view expose
  # applicant/agent name at all, or does it only ever live on each
  # individual application's own detail page? If the latter, exposing
  # this at scale means visiting a separate page per application rather
  # than one page per ~10 (the list view) — directly compounding the
  # WAF/429 blocking problem this whole session already fought hard to
  # understand. Prints real, direct findings straight to the log —
  # purely diagnostic, doesn't touch Supabase at all.
  # ---------------------------------------------------------------------
  applicant_agent_recon:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'applicant_agent_recon'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Run applicant/agent data recon
        run: cd scrapers && python applicant_agent_recon.py

  # ---------------------------------------------------------------------
  # Bright Data Web Unlocker API test — manual trigger only, no schedule.
  #
  # Built 2026-08-16, testing whether Web Unlocker API can get past
  # whatever's blocking Aberdeenshire Council (confirmed real "Page load
  # timeout" via idox_multi_recon.py — same signature as the existing
  # ~13-council WAF-blocked group). Plain HTTP requests only, no
  # Playwright/browser needed — Web Unlocker's own docs are explicit
  # it's built for single, stateless requests, not browser sessions.
  # Credentials read from GitHub Secrets, never hardcoded here or in the
  # script itself.
  # ---------------------------------------------------------------------
  brightdata_unlocker_test:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'brightdata_unlocker_test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run Bright Data Web Unlocker API test
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE_NAME: ${{ secrets.BRIGHTDATA_ZONE_NAME }}
        run: cd scrapers && python test_brightdata_unlocker.py

  # ---------------------------------------------------------------------
  # ScraperAPI test — manual trigger only, no schedule.
  #
  # Built 2026-08-16. All three residential proxy providers checked so
  # far (Bright Data, Oxylabs, Decodo) explicitly restrict government
  # sites behind KYC/ID verification. Worth testing ScraperAPI directly
  # rather than trust a secondhand, unverified claim that it doesn't.
  # Same three confirmed-blocked councils as the Bright Data test, for a
  # fair, direct comparison. Credentials read from GitHub Secrets, never
  # hardcoded here or in the script itself.
  # ---------------------------------------------------------------------
  scraperapi_test:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scraperapi_test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Run ScraperAPI test
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: cd scrapers && python test_scraperapi.py

  # ---------------------------------------------------------------------
  # Bright Data Browser API test — manual trigger only, no schedule.
  #
  # Built 2026-08-16, after seven rounds of testing ScraperAPI's plain
  # HTTP approach against a CSRF-protected Idox form all landed on the
  # same consistent 403. Browser API is a real remote browser connected
  # to via Playwright's connect_over_cdp() — our own already-proven
  # form-interaction logic can run essentially unchanged, sidestepping
  # the whole CSRF/cookie puzzle entirely. Only playwright itself is
  # needed here, NOT a local Chromium install — the actual browser runs
  # on Bright Data's own infrastructure, not the runner.
  # ---------------------------------------------------------------------
  brightdata_browser_api_test:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'brightdata_browser_api_test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - name: Run Bright Data Browser API test
        env:
          BRIGHTDATA_BROWSER_AUTH: ${{ secrets.BRIGHTDATA_BROWSER_AUTH }}
        run: cd scrapers && python test_brightdata_browser_api.py
