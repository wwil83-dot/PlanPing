      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx beautifulsoup4
      - name: Run Ribble Valley scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "15"
          DAYS_BACK: "30"
        run: cd scrapers && python ribblevalley_scraper.py

  idox_candidate_verify:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'idox_candidate_verify'
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Verify 19 candidate Idox councils
        run: cd scrapers && python idox_candidate_verify.py

  getapplications_isolation_diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'getapplications_isolation_diagnostic'
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run isolation diagnostic (Liverpool+Warrington, then Warrington alone)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: cd scrapers && python getapplications_isolation_diagnostic.py
