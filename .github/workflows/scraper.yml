        run: cd scrapers && python test_scraperapi.py

  # ---------------------------------------------------------------------
  # Bright Data Browser API test — manual trigger only, no schedule.
  #
  # Built 2026-08-16, after seven rounds of testing ScraperAPI's plain
  # HTTP approach against a CSRF-protected Idox form all landed on the
  # same consistent 403. Browser API is a real remote browser connected
  # to via Playwright's connect_over_cdp() — our own already-proven
  # form-interaction logic can run essentially unchanged, sidestepping
  # the whole CSRF/cookie puzzle entirely. Only playwright itself is
  # needed here, NOT a local Chromium install — the actual browser runs
  # on Bright Data's own infrastructure, not the runner.
  # ---------------------------------------------------------------------
  brightdata_browser_api_test:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'brightdata_browser_api_test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - name: Run Bright Data Browser API test
        env:
          BRIGHTDATA_BROWSER_AUTH: ${{ secrets.BRIGHTDATA_BROWSER_AUTH }}
        run: cd scrapers && python test_brightdata_browser_api.py
