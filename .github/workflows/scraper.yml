name: PlanPing scraper

on:
  schedule:
    - cron: '0 3 * * *'   # open data scrape
    # CHANGED — split each of the original 4 idox batches in half (8
    # total), alternating odd/even calendar days via cron's
    # day-of-month step syntax. Real evidence: batch 1 alone (56
    # councils) ran out of its 75-minute budget with 13 councils still
    # unreached (confirmed via real log — North Tyneside, Leeds and
    # others explicitly skipped with "time budget reached"). Halving
    # council count per run to ~28 gives real headroom back, at the
    # cost of each council only being checked every 2 nights instead
    # of nightly — same trade-off already accepted for Highland
    # (~3 days) and the Idox targeted group (~5 days) elsewhere in
    # this file. Validated with a real cron parser before use: odd
    # pattern fires only on 1,3,5,7...; even pattern only on
    # 2,4,6,8...; zero overlap between them.
    - cron: '0 4 1-31/2 * *'    # idox scrape — batch 1 of 8 (odd days)
    - cron: '0 4 2-30/2 * *'    # idox scrape — batch 2 of 8 (even days)
    - cron: '50 4 1-31/2 * *'   # idox scrape — batch 3 of 8 (odd days)
    - cron: '50 4 2-30/2 * *'   # idox scrape — batch 4 of 8 (even days)
    - cron: '40 5 1-31/2 * *'   # idox scrape — batch 5 of 8 (odd days)
    - cron: '40 5 2-30/2 * *'   # idox scrape — batch 6 of 8 (even days)
    - cron: '30 6 1-31/2 * *'   # idox scrape — batch 7 of 8 (odd days)
    - cron: '30 6 2-30/2 * *'   # idox scrape — batch 8 of 8 (even days)
    - cron: '20 7 * * *'  # arcus nightly scrape
    - cron: '35 7 * * *'  # civica nightly scrape (St Albans)
    - cron: '50 7 * * *'  # northgate nightly scrape (Runnymede)
    - cron: '55 7 * * *'  # northgate servlet-family nightly scrape (Hartlepool, High Peak, Staffordshire Moorlands)
    - cron: '0 8 * * *'   # northgate South Tyneside nightly scrape
    - cron: '5 8 * * *'   # NI Planning Portal nightly scrape
    - cron: '8 8 * * *'   # agileapplications.co.uk nightly scrape (Middlesbrough, Flintshire, Cannock)
    - cron: '12 8 * * *'  # statmap.co.uk/horizoNext nightly scrape (West Lindsey, East Staffordshire)
    - cron: '15 8 * * *'  # "Search/Advanced" family nightly scrape (Westmorland and Furness, Cherwell, Wychavon, Malvern Hills)
    - cron: '22 8 * * *'  # Barrow (Westmorland and Furness Council) nightly scrape — shares council_id with esl_scraper.py above, deliberately scheduled after it clears
    - cron: '28 8 * * *'  # OcellaWeb nightly scrape (Great Yarmouth, South Holland, Havering, Hillingdon)
    - cron: '32 8 * * *'  # Walsall (Swift/APAS) nightly scrape
    - cron: '35 8 * * *'  # Stratford-on-Avon (E-Planning v2.11) nightly scrape
    - cron: '40 8 * * *'  # Herefordshire nightly scrape
    - cron: '44 8 * * *'  # Medway (Open Digital Planning) nightly scrape
    - cron: '48 8 * * *'  # Ipswich (plain-ASP, httpx-only) nightly scrape
    - cron: '52 8 * * *'  # Central Bedfordshire (AcolNet) nightly scrape
    - cron: '54 8 * * *'  # West Dunbartonshire nightly scrape
    - cron: '55 8 * * *'  # Redcar and Cleveland nightly scrape
    - cron: '56 8 * * *'  # Kirklees nightly scrape
    - cron: '57 8 * * *'  # Amber Valley nightly scrape
    - cron: '58 8 * * *'  # South Derbyshire (Livewire) nightly scrape
    - cron: '59 8 * * *'  # Fylde (Planning + Building Control) nightly scrape
    - cron: '0 9 * * *'   # Ribble Valley nightly scrape
    - cron: '1 9 * * *'   # ODP Register nightly scrape (Barnet + Buckinghamshire)
    - cron: '2 9 * * *'   # Fife Council nightly scrape (ArcGIS, genuinely syncs nightly)
    - cron: '3 9 * * *'   # alerts
    - cron: '10 9 * * *'  # Charnwood nightly scrape — promoted after a confirmed
                          # clean production run (2026-09-10): 151 real
                          # applications saved across 8 pages, matching the
                          # real total exactly, plus 8 real recheck decision
                          # updates, zero errors
    - cron: '15 9 * * *'  # Edinburgh nightly scrape — promoted after a
                          # confirmed clean production run (2026-09-10): 111
                          # real applications saved across both weekly layers,
                          # zero errors (two decision-text variants still file
                          # as 'pending' rather than a positive outcome — see
                          # edinburgh_scraper.py's STATUS DIAGNOSTIC, a real
                          # but non-blocking limitation worth revisiting)
    - cron: '20 9 * * *'  # Telford and Wrekin nightly scrape — promoted
                          # after a confirmed clean production run
                          # (2026-09-10): 143 real applications saved
                          # (58 Registered + 85 Determined across both
                          # status tabs, real pagination confirmed exact),
                          # matching the real "Planning Applications (143)"
                          # total exactly, zero errors, 1.4 minutes total.
                          # Real fix needed a 4-round diagnostic trail: the
                          # aspxerrorpath redirect was ultimately a date
                          # format issue (dash, not slash), and the
                          # Determined tab's 85 applications were
                          # completely invisible under the old code —
                          # see telford_scraper.py's module docstring.
    - cron: '0 8 * * 1'   # council health digest — weekly, Monday 8am
    - cron: '0 10 */5 * *'   # Idox targeted group (WAF-sensitive) — every ~5 days
    - cron: '20 10 */5 * *'  # getApplications family (Liverpool, Warrington, Newcastle, Blackburn & Darwen, Waltham Forest) — every ~5 days
    - cron: '40 10 */3 * *'  # Highland Council — weekly-list PDFs, checked every ~3 days (real data only changes weekly)
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'scrape'
        type: choice
        options: [scrape, scrape_bulk, scrape_idox_a, scrape_idox_b, scrape_idox_c, scrape_idox_d, scrape_idox_e, scrape_idox_f, scrape_idox_g, scrape_idox_h, scrape_idox_targeted, scrape_idox_bulk, scrape_arcus, scrape_arcus_bulk, scrape_civica, scrape_northgate, scrape_ni, alerts, council_health, arcus_recon, idox_month_test, idox_form_recon, idox_multi_recon, idox_recon_round2, civica_recon, civica_stalbans_results_recon, harrow_weekly_recon, northgate_recon, northgate_runnymede_results_recon, northgate_url_healthcheck, idox_gap_prober, idox_cheltenham_lewisham_verify, redbridge_recon, diagnose_runner_location, applicant_agent_recon, brightdata_unlocker_test, scraperapi_test, brightdata_browser_api_test, ni_planningsystemni_recon, getapplications_family_recon, scrape_getapplications, idox_waf_recheck, priority1_diagnostic, scraperapi_priority1_test, priority1_diagnostic_us_runner, derby_results_page_test, northgate_servlet_family_recon, northgate_servlet_scraper, northgate_south_tyneside_scraper, webshare_priority1_test, priority3_recon, statmap_weeklylist_recon, statmap_results_recon, statmap_weeklydate_recon, agileapplications_scraper, statmap_scraper, conwy_visibility_diagnostic, bromley_platform_check, wandf_recon, wandf_recon_round2, wandf_recon_round3, barrow_iframe_check, esl_pagination_test, esl_request_inspection, esl_next_link_test, esl_ajax_pagination_test, esl_real_click_test, esl_scraper, search_advanced_family_recon, nwarks_disclaimer_recon, nwarks_fullflow_test, barrow_scraper, barrow_decided_recon, esl_detail_page_recon, esl_cherwell_nwarks_detail_recon, test_nwarks_date_fetch_direct, nwarks_date_fetch_verbose_diag, ocellaweb_family_recon, ocellaweb_results_recon, ocellaweb_scraper, never_succeeded_diagnostic, oneoff_batch_recon, scambs_cambridge_url_check, gcambridge_separation_check, oneoff_round2_recon, oneoff_round3_recon, oneoff_round4_recon, walsall_scraper, stratford_search_flow_check, stratford_advanced_search_recon, stratford_real_submission_test, stratford_network_capture, stratford_scraper, herefordshire_real_results_recon, herefordshire_weekly_list_recon, herefordshire_wide_range_test, herefordshire_scraper, medway_search_recon, medway_scraper, charnwood_assure_recon, charnwood_search_recon, charnwood_guid_pagination_test, charnwood_scraper, ipswich_scraper, central_beds_scraper, backlog_batch_recon2, backlog_batch_recon3, west_dunbarton_scraper, redcar_cleveland_scraper, kirklees_scraper, telford_scraper, amber_valley_scraper, telford_diagnostic_recon, backlog_batch_recon4, south_derbyshire_scraper, fylde_scraper, ribblevalley_recon, ribblevalley_scraper, idox_candidate_verify, getapplications_isolation_diagnostic, webshare_idox_candidates_test, odp_register_scraper, barnet_page2_diagnostic, platform_family_verify, glasgow_edinburgh_arcgis_recon, glasgow_edinburgh_arcgis_recon2, agile_criteria_url_test, edinburgh_webmap_recon3, glasgow_arcgis_recon4, edinburgh_scraper, glasgow_arcgis_recon5, glasgow_arcgis_recon6, glasgow_arcgis_recon7, glasgow_pdf_recon, highland_pdf_recon, highland_scraper, multi_council_arcgis_recon, multi_council_arcgis_recon2, fife_scraper, durham_lancashire_arcgis_recon, telford_aspxerror_diagnostic, telford_calendar_diagnostic, telford_results_structure_diagnostic, fylde_cluster_recon, planning_register_scraper]
      arcus_target_url:
        description: '(arcus_recon only) base URL to reconnoitre, e.g. https://example.my.site.com/pr/s — leave blank to default to Ashford as a sanity check'
        required: false
        default: ''
      arcus_target_name:
        description: '(arcus_recon only) human-readable name for the council being reconnoitred, purely for log readability'
        required: false
        default: ''

jobs:
  diagnose_runner_location:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'diagnose_runner_location'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check real IP and geolocation (ipinfo.io)
        run: |
          echo "=== ipinfo.io ==="
          curl -s https://ipinfo.io/json || echo "ipinfo.io request failed"
      - name: Check real IP and geolocation (ip-api.com)
        run: |
          echo "=== ip-api.com ==="
          curl -s http://ip-api.com/json || echo "ip-api.com request failed"
      - name: Summary
        run: |
          echo ""
          echo "If both services above report a country OTHER than GB/United"
          echo "Kingdom, that's real, direct confirmation our scraper traffic"
          echo "presents as non-UK to any council WAF checking geolocation —"
          echo "the same mechanism a VPN showing as offshore triggers on these"
          echo "same portals when tested manually."

  scrape:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Run harvester
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: cd scrapers && python data_gov_harvester.py

  scrape_bulk:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_bulk'
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Run bulk harvester
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: cd scrapers && python data_gov_harvester.py --bulk

  # ---------------------------------------------------------------------
  # Idox nightly scrape — split into 8 batches (was 4), each covering
  # roughly half as many councils, alternating odd/even calendar days.
  # See idox_scraper.py's --batch/--total-batches flags — the split is
  # computed dynamically from IDOX_COUNCILS' current length, nothing
  # here needs updating as councils are added or removed.
  #
  # CHANGED — real evidence a single 4-way batch (56 councils) was
  # running out of its 75-minute budget with 13 councils left
  # unreached (confirmed via real log: North Tyneside, Leeds and
  # others explicitly skipped with "time budget reached" at the
  # 72-minute mark). Halving each batch's council count restores real
  # headroom without needing a bigger time budget at all.
  # ---------------------------------------------------------------------
  scrape_idox_a:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_a') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 1-31/2 * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — batch 1 of 8, odd days (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=1 --total-batches=8

  scrape_idox_b:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_b') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 2-30/2 * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — batch 2 of 8, even days (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=2 --total-batches=8

  scrape_idox_c:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_c') ||
      (github.event_name == 'schedule' && github.event.schedule == '50 4 1-31/2 * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — batch 3 of 8, odd days (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=3 --total-batches=8

  scrape_idox_d:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_d') ||
      (github.event_name == 'schedule' && github.event.schedule == '50 4 2-30/2 * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — batch 4 of 8, even days (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=4 --total-batches=8

  scrape_idox_e:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_e') ||
      (github.event_name == 'schedule' && github.event.schedule == '40 5 1-31/2 * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — batch 5 of 8, odd days (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=5 --total-batches=8

  scrape_idox_f:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_f') ||
      (github.event_name == 'schedule' && github.event.schedule == '40 5 2-30/2 * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — batch 6 of 8, even days (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=6 --total-batches=8

  scrape_idox_g:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_g') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 6 1-31/2 * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — batch 7 of 8, odd days (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=7 --total-batches=8

  scrape_idox_h:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_h') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 6 2-30/2 * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — batch 8 of 8, even days (last 14 days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "75"
          DAYS_BACK: "14"
          CONCURRENCY: "2"
          REQUEST_DELAY_SECONDS: "0"
        run: cd scrapers && python idox_scraper.py --batch=8 --total-batches=8

  scrape_idox_targeted:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_targeted') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 10 */5 * *')
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — targeted group (confirmed WAF/429 councils)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "80"
          DAYS_BACK: "14"
          CONCURRENCY: "1"
          REQUEST_DELAY_SECONDS: "5"
        run: cd scrapers && python idox_scraper.py --targeted

  scrape_idox_bulk:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_idox_bulk'
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright beautifulsoup4 httpx
      - run: playwright install --with-deps chromium
      - name: Run Idox scraper — bulk (last 180 days, full council list)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_MINUTES: "180"
          DAYS_BACK: "180"
          CONCURRENCY: "1"
        run: cd scrapers && python idox_scraper.py --bulk

  scrape_arcus:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scrape_arcus') ||
      (github.event_name == 'schedule' && github.event.schedule == '20 7 * * *')
