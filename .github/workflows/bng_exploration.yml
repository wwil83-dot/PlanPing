name: BNG Register Exploration

# Manual-trigger exploration, deliberately separate from PlanFind's
# scrape.yml. Pulls the whole Biodiversity Gain Sites register
# (~395 sites) into files and prints the numbers needed to judge
# whether a product is viable. Read-only against PlanFind's database
# (only used for the optional planning-reference cross-check).
#
# Tip: run once with max_sites = 20 as a quick trial before the full run.

on:
  workflow_dispatch:
    inputs:
      max_sites:
        description: 'Limit sites for a trial run (0 = all sites)'
        default: '0'

jobs:
  bng_full_extract:
    runs-on: [self-hosted, uk-runner]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - run: pip install playwright httpx pyproj
      - run: playwright install --with-deps chromium
      - name: Extract the BNG register
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAX_SITES: ${{ github.event.inputs.max_sites }}
          WORKERS: "3"
        run: cd scrapers && python bng_full_extract.py
      - name: Upload the extracted data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bng-register-data
          path: |
            /tmp/bng_sites.json
            /tmp/bng_allocations.csv
            /tmp/bng_allocations_matched.csv
          retention-days: 14
